<div class="flex items-start">

    <!-- Navigation -->
    <nav class="hidden md:block sticky top-0 h-screen w-64 shrink-0 overflow-y-auto bg-(--mat-sys-primary-fixed)">
        <ul class="flex flex-col gap-3 py-3 px-4">
            @for (item of navItems; track $index) {
                <li>
                    <a [routerLink]="item.link"
                       routerLinkActive="bg-(--mat-sys-primary) text-white"
                       matRipple
                       class="flex items-center gap-4 w-full cursor-pointer px-4 py-3 rounded-lg text-(--mat-sys-primary)"
                    >
                        <mat-icon [fontIcon]="item.iconName"></mat-icon>
                        <span>{{ item.name }}</span>
                    </a>
                </li>
            }
        </ul>
    </nav>

    <!-- Side content -->
    <div class="flex-1 min-w-0 p-3 sm:p-5">
        <router-outlet />
    </div>

</div>
